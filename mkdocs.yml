site_name: Servo Documentation
site_description: The Language-Agnostic Developer Dashboard
site_author: Servo Team

theme:
  name: material
  palette:
    scheme: slate
    primary: blue
    accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
    - Managing Projects: user-guide/managing-projects.md
    - Log Viewer: user-guide/log-viewer.md
    - Hotkeys & PiP: user-guide/hotkeys-pip.md
  - Architecture: architecture.md
  - Development: development.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
